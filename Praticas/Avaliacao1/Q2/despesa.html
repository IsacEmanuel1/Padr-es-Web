<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despesas Mensais</title>
    <link rel="stylesheet" href="staly.css">
</head>

<body>
    <table class="tabela-despesas">
        <caption><strong>Despesas Mensais</strong></caption>
        <thead>
            <tr>
                <th>Despesas</th>
                <th>Categoria</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aluguel</td>
                <td rowspan="2">Moradia</td>
                <td>R$ 1.200,00</td>
            </tr>
            <tr class="verde-calro">
                <td>Conta de Luz</td>
                <td>R$ 150,00</td>
            </tr>
            <tr>
                <td>Supermercado</td>
                <td>Alimentação</td>
                <td>R$ 600,00</td>
            </tr>
            <tr class="verde-calro">
                <td>Internet</td>
                <td>Essencial</td>
                <td>R$ 99,90</td>
            </tr>
            <tr>
                <td>Plano de Saude</td>
                <td>Saúde</td>
                <td>R$ 450,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th class="verde-escuro" colspan="2">Total</th>
                <th><strong>R$ 2.499,90</strong></th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
