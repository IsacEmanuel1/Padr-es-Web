<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FVP Horizon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>

<body>

    <header class="cabecalho">
        <div class="container">
            <h1>FVP Horizon</h1>
        </div>
    </header>

    <div class="container mt-4">
        <div id="meuCarrossel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#meuCarrossel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#meuCarrossel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#meuCarrossel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#meuCarrossel" data-bs-slide-to="3"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../layout_responsivo_Bootstrap/img/drone-fpv-freestyle.jpg" class="d-block w-100" alt="Drone 1">
                </div>
                <div class="carousel-item">
                    <img src="../layout_responsivo_Bootstrap/img/Conheca-os-5-drones-de-corrida-que-atingem-200-kmh-em-segundos-e-as-imagens-incriveis-que-eles-produzem-2-1095x730.jpg" class="d-block w-100" alt="Drone 2">
                </div>
                <div class="carousel-item">
                    <img src="../layout_responsivo_Bootstrap/img/fpvdrone.jpg" class="d-block w-100" alt="Drone 3">
                </div>
                <div class="carousel-item">
                    <img src="../layout_responsivo_Bootstrap/img/dronefpvVoo.jpg" class="d-block w-100" alt="Drone 4">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#meuCarrossel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#meuCarrossel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">

            <div class="col-12 col-md-6 col-lg-3 mb-3">
                <div class="card h-100">
                    <img src="../layout_responsivo_Bootstrap/img/DroneFreestyle.jpg" class="card-img-top" alt="Drone Freestyle">
                    <div class="card-body">
                        <h5 class="card-title">Drone Freestyle</h5>
                        <p class="card-text">Drone para acrobacias e manobras aéreas.</p>
                        <a href="#" class="btn btn-primary">Ver mais</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-3">
                <div class="card h-100">
                    <img src="../layout_responsivo_Bootstrap/img/DroneRace.jpg" class="card-img-top" alt="Drone Race">
                    <div class="card-body">
                        <h5 class="card-title">Drone Race</h5>
                        <p class="card-text">Drone de alta velocidade para corridas.</p>
                        <a href="#" class="btn btn-primary">Ver mais</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-3">
                <div class="card h-100">
                    <img src="../layout_responsivo_Bootstrap/img/DroneFastestFPV.webp" class="card-img-top" alt="Drone Cinematic">
                    <div class="card-body">
                        <h5 class="card-title">Drone Fastest FPV</h5>
                        <p class="card-text">Drone para filmagens de alta velocidade</p>
                        <a href="#" class="btn btn-primary">Ver mais</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-3">
                <div class="card h-100">
                    <img src="../layout_responsivo_Bootstrap/img/Drone_DJI_FPV.webp" class="card-img-top" alt="Drone DJI FPV">
                    <div class="card-body">
                        <h5 class="card-title">Drone DJI FPV</h5>
                        <p class="card-text">Drone FPV da DJI com óculos imersivos.</p>
                        <a href="#" class="btn btn-primary">Ver mais</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer class="rodape text-center">
        <div class="container">
            <p>FVP Horizon - 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
