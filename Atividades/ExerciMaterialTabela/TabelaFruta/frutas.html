<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Frutas</title>
    <link rel="stylesheet" href="staly.css">
</head>

<body>
    <table class="tabela-frutas">
        <caption><strong>Preço de Frutas</strong></caption>
        <thead>
            <tr>
                <th>Frutas</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Maçã</td>
                <td>R$ 0,40</td>
            </tr>
            <tr>
                <td>Laranja</td>
                <td>R$ 0,50</td>
            </tr>
            <tr>
                <td>Banana</td>
                <td>R$ 0,50</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>R$ 1,40</th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
