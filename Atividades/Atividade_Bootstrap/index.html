<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <h1 class="text-center mb-5">Login</h1>
    
    <form>

      <div class="mb-4">
        <label for="usuario" class="form-label fw-semibold text-secondary">Usuário</label>
        <input type="text" class="form-control form-control-lg" id="usuario" placeholder="">
      </div>
    
      <div class="mb-4">
        <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
        <input type="password" class="form-control form-control-lg" id="senha" placeholder="">
      </div>
      
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary btn-lg px-4">Entrar</button>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
