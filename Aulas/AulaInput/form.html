<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Matrícula</h1>
    <form>
        <div>
            <label for="nome">Nome</label>
            <input id="nome" type="text" maxlength="50">
        </div>
        <div>
            <label for="mat">Matrícula</label>
            <input id="mat" type="number" maxlength="14" min="0">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" maxlength="30">
        </div>
        <div>
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" 
                   placeholder="000.000.000-00" 
                   maxlength="14">
        </div>
        <div>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" 
                    maxlength="15"
                    placeholder="(DD) 0000.0000">

        </div>
        <div>
            <input type="button" value="Matricular">
        </div>
    </form>
    <script src="https://unpkg.com/imask"></script>
    <script src="mascaraInput.js"></script>
</body>
</html>
